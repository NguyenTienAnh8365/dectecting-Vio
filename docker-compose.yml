# Hạ tầng demo violence detection: chỉ cần Redis (message bus).
# Snapshot/clip bằng chứng lưu disk local (dashboard serve), không cần MinIO cho demo.
#
#   docker compose up -d
#   docker compose down -v   # xóa cả data
#
# Redis ở 6381 để KHÔNG đụng redis của dự án khác (RS test 6380, prod 6379).

services:
  redis:
    image: redis:7-alpine
    container_name: vio-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --maxmemory 8gb --maxmemory-policy noeviction --appendonly no --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
